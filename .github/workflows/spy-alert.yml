name: SPY trade alert

# Posts the pullback→continuation plan to Slack twice on trading days.
#
# GitHub's cron scheduler can drift by HOURS under load (observed: crons meant
# for 10:15/15:50 ET landing at 13:44, 14:35, 18:00, 18:49 ET). So each target
# gets 3 attempts (EDT offset, EST offset, and a backstop an hour later), the
# job maps github.event.schedule -> an explicit mode (never relies on wall-
# clock "auto" for a cron trigger), and run_alert.py's --ignore-window skips
# the time check while still respecting the trading-day/holiday gate. The
# per-day marker (restored from cache) stops repeats from double-posting.

on:
  schedule:
    - cron: "15 14 * * 1-5"   # ~10:15 EDT  (morning, attempt 1)
    - cron: "15 15 * * 1-5"   # ~10:15 EST  (morning, attempt 2)
    - cron: "15 16 * * 1-5"   # backstop    (morning, attempt 3)
    - cron: "50 19 * * 1-5"   # ~15:50 EDT  (close, attempt 1)
    - cron: "50 20 * * 1-5"   # ~15:50 EST  (close, attempt 2)
    - cron: "50 21 * * 1-5"   # backstop    (close, attempt 3)
  workflow_dispatch:
    inputs:
      mode:
        description: mode (auto|morning|close)
        default: auto
      kind:
        description: "trade-plan (backtested contract) or price-target (read-only level+timing view)"
        default: trade-plan

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: outputs/.alert_*
          key: alert-markers-${{ steps.day.outputs.d }}
      - name: Map schedule -> mode
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "15 14 * * 1-5"|"15 15 * * 1-5"|"15 16 * * 1-5")
              echo "mode=morning" >> "$GITHUB_OUTPUT" ;;
            "50 19 * * 1-5"|"50 20 * * 1-5"|"50 21 * * 1-5")
              echo "mode=close" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "mode=${{ github.event.inputs.mode || 'auto' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run alert(s)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.kind }}" ]; then
            python run_alert.py --mode "${{ steps.pick.outputs.mode }}" \
              --kind "${{ github.event.inputs.kind }}" --ignore-window
          else
            # scheduled runs post both: the backtested contract plan and the
            # read-only price-target view. Independent dedupe markers, so
            # either can fire without the other.
            python run_alert.py --mode "${{ steps.pick.outputs.mode }}" \
              --kind trade-plan --ignore-window
            python run_alert.py --mode "${{ steps.pick.outputs.mode }}" \
              --kind price-target --ignore-window
          fi
