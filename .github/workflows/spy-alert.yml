name: SPY trade alert

# Posts the pullback→continuation plan to Slack twice on trading days.
# GitHub cron is UTC; ET is UTC-4 (Mar–Nov) or UTC-5 (Nov–Mar), so each target
# time is scheduled at BOTH offsets and a per-day marker (restored from cache)
# stops the second one from double-posting.

on:
  schedule:
    - cron: "15 14 * * 1-5"   # 10:15 EDT  (morning)
    - cron: "15 15 * * 1-5"   # 10:15 EST  (morning)
    - cron: "50 19 * * 1-5"   # 15:50 EDT  (close)
    - cron: "50 20 * * 1-5"   # 15:50 EST  (close)
  workflow_dispatch:
    inputs:
      mode:
        description: mode (auto|morning|close)
        default: auto

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: outputs/.alert_*
          key: alert-markers-${{ steps.day.outputs.d }}
      - name: Run alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python run_alert.py --mode "${{ github.event.inputs.mode || 'auto' }}"
